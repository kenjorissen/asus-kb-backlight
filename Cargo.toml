[package]
name = "asus-kbdlight"
version = "0.1.6"
edition = "2024"
description = "Control and enforce ASUS keyboard backlight brightness through ASUS WMI"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tray-icon = "0.24.1"
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8.1"
wmi = "0.18.4"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
strip = true
lto = "thin"
